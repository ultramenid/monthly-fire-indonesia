# Production: CI builds a config-free image and deploy/remote-deploy.sh runs it here with WEB_TAG=sha-<commit>.
# All settings come from this server's .env (VITE_* are served to the browser as /config.js; WEB_TAG is written by the deploy).
# Local: `docker compose up -d --build`.
# The site listens on 127.0.0.1:$WEB_PORT only: the host's nginx serves the domains (site: deploy/monthly-fire.conf).
services:
  web:
    image: ghcr.io/ultramenid/monthly-fire-indonesia:${WEB_TAG:-latest}
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:8080"
    restart: unless-stopped