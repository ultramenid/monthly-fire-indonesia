# Production: CI builds a config-free image and deploy/remote-deploy.sh runs it here with WEB_TAG=sha-<commit>.
# All settings come from this server's .env (VITE_* are served to the browser as /config.js; WEB_TAG is written by the deploy).
# Local: `docker compose up -d --build`.
# Caddy serves https://$DOMAIN (comma-separated list allowed) with an automatic certificate and proxies to the site.
services:
  web:
    image: ghcr.io/ultramenid/monthly-fire-indonesia:${WEB_TAG:-latest}
    build: .
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
