server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Runtime config from the container env (server .env), filled in by envsubst when nginx starts
  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    return 200 'window.__CONFIG = {"VITE_API_URL":"${VITE_API_URL}","VITE_MAPBIOMAS_URL":"${VITE_MAPBIOMAS_URL}","VITE_BASEMAP_DARK":"${VITE_BASEMAP_DARK}","VITE_BASEMAP_LIGHT":"${VITE_BASEMAP_LIGHT}","VITE_BASEMAP_SATELLITE":"${VITE_BASEMAP_SATELLITE}"};\n';
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Vite fingerprints everything in /assets, so it can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # SPA: unknown paths get index.html; never cache it so new deploys show up at once
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri $uri/ /index.html;
  }
}
