name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  # Called by release.yml so direct pushes to main are tested before they are built and deployed.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          web() { echo "web=$1" | tee -a "$GITHUB_OUTPUT"; }
          # Fail open: no usable base (new branch, force push, manual run) → test everything.
          MERGE="$(git merge-base HEAD "$BASE" 2>/dev/null || true)"
          [ -n "$MERGE" ] || { web true; exit 0; }
          DIFF="$(git diff --name-only "$MERGE" HEAD)"
          if echo "$DIFF" | grep -qE '^(src/|public/|index\.html|package(-lock)?\.json|tsconfig|vite\.config\.ts|\.oxlintrc\.json|Dockerfile|nginx\.conf|compose\.yml|Caddyfile|deploy/|\.github/)'; then
            web true
          else
            web false
          fi

  # Cheapest gate first: lint, then the full build (tsc -b + vite build); the build needs no config.
  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Leaked-credential scan of the working tree (not history), values redacted from the log, version pinned.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan for leaked secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-git --redact --verbose --exit-code 1
