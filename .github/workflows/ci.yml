name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip everything when only docs changed (*.md, .gitignore)
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            web=true   # first push, manual run, or force push: check everything
          elif git diff --name-only "$BASE" HEAD | grep -qvE '\.md$|^\.gitignore$'; then
            web=true
          else
            web=false
          fi
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  # Deploy secrets must be set (Settings → Secrets and variables → Actions); fork PRs get no secrets, so skip them
  secrets:
    needs: changes
    if: needs.changes.outputs.web == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER SSH_KEY; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v"; missing=1; }
          done
          exit $missing

  lint:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run build

  # On main: SSH to the server, clone the repo there on first run (or pull), then rebuild with the server's .env.
  # Settings → Secrets: SSH_HOST, SSH_USER, SSH_KEY (private key), SSH_PASSPHRASE (optional)
  # Settings → Variables: DEPLOY_PATH (optional, default ~/monthly-fire-indonesia)
  deploy:
    needs: [secrets, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -e
            DIR="${{ vars.DEPLOY_PATH }}"
            DIR="${DIR:-$HOME/monthly-fire-indonesia}"
            if [ ! -d "$DIR/.git" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git "$DIR"
            fi
            cd "$DIR"
            git pull --ff-only origin main
            if [ ! -f .env ]; then
              echo "No .env in $DIR. Create it (cp .env.example .env, set VITE_* and DOMAIN), then re-run this job."
              exit 1
            fi
            docker compose up -d --build --remove-orphans
            # Remove unused images and build cache older than 1 day (the running image is in use, so it stays)
            docker image prune -af --filter "until=24h"
            docker builder prune -f --filter "until=24h"
