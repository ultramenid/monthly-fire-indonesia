# Host nginx site for this stack, in the same style as fire-buminusantara's.
# The app is a static SPA served by the container's own nginx on 127.0.0.1:3001 (WEB_PORT in the server's .env):
# no Next.js-specific bits (no /_next/static, no upload size, no streaming buffering) and no long proxy
# timeouts (heavy requests like the GIF go browser → fogo-id API directly, not through this proxy).
# One-time install order (see README → Production): install this file, issue the cert with the webroot
# (the port-80 block below serves the ACME challenge), then nginx -t && systemctl reload nginx.
server {
    listen      80;
    listen      [::]:80;
    server_name kobong.nusantara.earth kobong.mapbiomas.id platform.fire.monthly.mapbiomas.id;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # http2 as a listen parameter: nginx on this server is < 1.25.1, where "http2 on;" doesn't exist yet.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name kobong.nusantara.earth kobong.mapbiomas.id platform.fire.monthly.mapbiomas.id;

    # ── TLS (one cert covering both names: the -d order names the cert after the first domain) ──
    ssl_certificate     /etc/letsencrypt/live/kobong.nusantara.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kobong.nusantara.earth/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;

    # ── Logs ──────────────────────────────────────────────
    error_log  /var/log/nginx/monthly-fire-error.log;
    access_log /var/log/nginx/monthly-fire-access.log;

    # The container's nginx already caches /assets for a year and falls back to index.html for unknown
    # paths, so one plain location is enough.
    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}